<!DOCTYPE html>
<html lang="de">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Bluewater Jazz Festival 2026 – Programm</title>
</head>

<body>

  <header>
    <h1>Bluewater Jazz Festival 2026</h1>
    <p>17. – 19. Juli 2026 · Hafengelände Nordstadt</p>
  </header>

  <main>

    <section>
      <h2>Lineup</h2>

      <ul>
        <li><button onclick="zeigeKuenstler('The Harlem Swingers', 'Swing', 'Freitag, 18:00 · Hauptbühne', 'Eröffnungsabend mit der Kraft des klassischen Big-Band-Swings. Arrangements aus den 1940ern, neu interpretiert für heute.')">The Harlem Swingers</button></li>
        <li><button onclick="zeigeKuenstler('Calle Caliente Quartet', 'Latin Jazz', 'Freitag, 19:30 · Hafenbühne', 'Afro-kubanische Rhythmen treffen auf modale Harmonik. Heißblütig, mitreißend, unvergesslich.')">Calle Caliente Quartet</button></li>
        <li><button onclick="zeigeKuenstler('Marcus Bell Trio', 'Bebop', 'Freitag, 21:00 · Hauptbühne', 'Virtuoses Bebop-Piano in der Tradition von Bud Powell und Thelonious Monk.')">Marcus Bell Trio</button></li>
        <li><button onclick="zeigeKuenstler('Das Kollektiv', 'Free Jazz', 'Freitag, 22:30 · Clubbühne', 'Spätnächtliche Grenzüberschreitung. Sechs Musiker, keine Vorgaben, reine Energie.')">Das Kollektiv</button></li>
        <li><button onclick="zeigeKuenstler('Elena Voss & Band', 'Smooth Jazz', 'Samstag, 18:00 · Hafenbühne', 'Samtig, elegant und unvermittelt berührend. Elena Voss verarbeitet persönliche Geschichten zu atmosphärischen Kompositionen.')">Elena Voss &amp; Band</button></li>
        <li><button onclick="zeigeKuenstler('The Blue Note Project', 'Hard Bop', 'Samstag, 19:30 · Hauptbühne', 'Eine Hommage an das goldene Zeitalter des Hard Bop: Art Blakey, Horace Silver und Lee Morgan als Inspiration.')">The Blue Note Project</button></li>
        <li><button onclick="zeigeKuenstler('Electric Storm', 'Jazz Fusion', 'Samstag, 21:00 · Hauptbühne', 'Hochoktaniger Fusion-Jazz mit Einflüssen aus Funk, Rock und elektronischer Musik.')">Electric Storm</button></li>
        <li><button onclick="zeigeKuenstler('Noche Brava', 'Latin Jazz', 'Samstag, 22:30 · Hafenbühne', 'Brasilianischer Samba trifft kubanischen Son. Das Septett bringt das Hafengelände zum Tanzen.')">Noche Brava</button></li>
        <li><button onclick="zeigeKuenstler('Yuki Tanaka Solo', 'Avantgarde', 'Sonntag, 18:00 · Clubbühne', 'Stille und Klang als gleichwertige Partner. Yuki Tanaka erkundet am Flügel die Grenzen zwischen Komposition und Improvisation.')">Yuki Tanaka Solo</button></li>
        <li><button onclick="zeigeKuenstler('Straight Ahead All-Stars', 'Bebop', 'Sonntag, 19:30 · Hauptbühne', 'Festival-Highlights vereint auf einer Bühne: Sieben Stars der Szene improvisieren gemeinsam über Bebop-Standards.')">Straight Ahead All-Stars</button></li>
        <li><button onclick="zeigeKuenstler('Orbital Jazz Collective', 'Jazz Fusion', 'Sonntag, 21:00 · Hauptbühne', 'Das Headliner-Konzert des Festivals. Acht Musiker, fünf Kontinente, eine gemeinsame Sprache: Groove.')">Orbital Jazz Collective</button></li>
        <li><button onclick="zeigeKuenstler('Late Night Jam Session', 'Swing', 'Sonntag, 22:30 · Hafenbühne', 'Festival-Finale: Alle Musiker des Wochenendes kommen noch einmal zusammen. Spontan, ausgelassen, legendär.')">Late Night Jam Session</button></li>
      </ul>
    </section>

    <section>
      <h2 id="kuenstler-name">← Künstler auswählen</h2>
      <p id="kuenstler-genre"></p>
      <p id="kuenstler-zeit"></p>
      <p id="kuenstler-info"></p>
    </section>

  </main>

  <footer>
    <p>&copy; 2026 Bluewater Jazz Festival e.V.</p>
  </footer>

  <script>
    function zeigeKuenstler(name, genre, zeit, info) {
      document.getElementById('kuenstler-name').textContent = name;
      document.getElementById('kuenstler-genre').textContent = genre;
      document.getElementById('kuenstler-zeit').textContent = zeit;
      document.getElementById('kuenstler-info').textContent = info;
    }
  </script>

</body>
</html>
